id: scenario-f02-latency
fault_class: F02
services:
  api:
    role: application
    depends_on: [payment_provider]
  payment_provider:
    role: downstream_api
health:
  api: healthy
  payment_provider: degraded
quality:
  golden_set: ./golden_set.yaml
  min_cases: 20
  scorers: [latency]
objectives:
  latency:
    value: 5000.0
    threshold: 2000.0
    weight: 1.0
tolerance:
  quality_drop_pct: 15.0
  latency_increase_pct: 50.0
  cost_increase_pct: 100.0
reversible_state:
  circuit_breaker_status:
    value: closed
permissions:
  allowed_actions:
    - enable_circuit_breaker
  max_risk_tier: MEDIUM
signals:
  provider_latency_ms: 5000.0
evidence:
  - id: ev-001
    kind: metric
    source: provider_latency_ms
    value: 5000.0
  - id: ev-002
    kind: log
    source: api
    payload:
      status: 504
      message: "upstream request timeout"
state:
  circuit_breaker_status: closed
  provider_latency: degraded
debt: {}
