id: scenario-f08-config
fault_class: F08
services:
  api:
    role: application
health:
  api: degraded
quality:
  golden_set: ./golden_set.yaml
  min_cases: 20
  scorers: [availability]
objectives:
  availability:
    value: 0.5
    threshold: 0.99
    weight: 1.0
tolerance:
  quality_drop_pct: 15.0
  latency_increase_pct: 50.0
  cost_increase_pct: 100.0
reversible_state:
  config_version:
    value: v3.1
permissions:
  allowed_actions:
    - rollback_config
  max_risk_tier: MEDIUM
signals:
  config_errors: 100
# The config_errors signal below was declared but never surfaced as evidence,
# and nothing recorded that the configuration had just changed -- which is the
# one fact that separates a config regression from a prompt regression, a code
# regression or a dependency fault presenting the same way. Every rep answered
# INSUFFICIENT_EVIDENCE, correctly, on evidence that distinguished nothing.
# These are the facts a real config regression produces; the diagnosis still
# has to be inferred from them.
evidence:
  - id: ev-001
    kind: log
    source: api
    payload:
      message: "KeyError: missing feature toggle flag"
  - id: ev-002
    kind: metric
    source: config_errors
    value: 100
  - id: ev-003
    kind: state
    source: api
    payload:
      config_version: v3.1
      previous_config_version: v3.0
      applied_s_before_first_error: 45
state:
  config_health: regressed
  config_version: v3.1
debt: {}
