id: scenario-amb-degraded
# Not a fault class. This scenario exists to be undiagnosable: the correct
# answer is INSUFFICIENT_EVIDENCE, and the correct outcome is to escalate
# without touching the application.
#
# Every other scenario in this directory carries evidence that points at one
# catalogue entry, so a model that always guessed something would have scored
# well and nothing would have caught it. PRD 11 wants RCA accuracy; failing
# closed on evidence that distinguishes nothing is the other half of that, and
# it was unmeasured. The symptoms below are real but generic: the service is
# slow and erroring, and nothing says why.
fault_class: INSUFFICIENT_EVIDENCE
services:
  api:
    role: application
    depends_on: [model_primary]
  model_primary:
    role: model_primary
health:
  api: degraded
  model_primary: healthy
quality:
  golden_set: ./golden_set.yaml
  min_cases: 20
  scorers: [availability, latency]
objectives:
  availability:
    value: 0.92
    threshold: 0.99
    weight: 1.0
  latency:
    value: 2.4
    threshold: 2.0
    weight: 0.6
tolerance:
  quality_drop_pct: 15.0
  latency_increase_pct: 50.0
  cost_increase_pct: 100.0
reversible_state:
  model_selection:
    value: model_primary
permissions:
  # Broad on purpose. These are the repairs for the fault classes whose symptoms
  # overlap a degraded, erroring, slow service, so a guess can reach execution.
  # With a narrower list the allow-list refuses the guessed repair and the run
  # looks like a system that failed closed, when what happened is that the gate
  # caught a diagnosis the model was confident about. The property under test is
  # the diagnosis, so the gate must not be the thing answering.
  allowed_actions:
    - switch_model
    - enable_circuit_breaker
    - flush_cache
    - rollback_config
    - scale_connection_pool
    - enable_token_limiter
  max_risk_tier: MEDIUM
signals:
  http_requests_errors_ratio: 0.08
  api_latency_ms: 2400.0
evidence:
  - id: ev-001
    kind: metric
    source: http_requests_errors_ratio
    value: 0.08
  - id: ev-002
    kind: log
    source: api
    payload:
      message: "request failed"
  - id: ev-003
    kind: state
    source: api
    payload:
      health: degraded
state:
  api: degraded
  active_model: model_primary
debt: {}
