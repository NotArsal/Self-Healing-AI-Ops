id: scenario-f04-cache
fault_class: F04
services:
  api:
    role: application
  cache:
    role: memory_store
health:
  api: healthy
  cache: poisoned
quality:
  golden_set: ./golden_set.yaml
  min_cases: 20
  scorers: [quality]
objectives:
  quality:
    value: 0.4
    threshold: 0.8
    weight: 1.0
tolerance:
  quality_drop_pct: 15.0
  latency_increase_pct: 50.0
  cost_increase_pct: 100.0
reversible_state:
  cache_state:
    value: poisoned
permissions:
  allowed_actions:
    - flush_cache
  max_risk_tier: LOW
signals:
  cache_hit_ratio: 0.99
  quality_score: 0.4
evidence:
  - id: ev-001
    kind: metric
    source: quality_score
    value: 0.4
  - id: ev-002
    kind: log
    source: api
    payload:
      message: "serving stale malformed prompt from cache"
state:
  cache_state: poisoned
debt: {}
