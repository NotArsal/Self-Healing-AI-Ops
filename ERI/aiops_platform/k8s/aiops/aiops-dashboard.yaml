apiVersion: apps/v1
kind: Deployment
metadata:
  name: aiops-dashboard
  namespace: aiops
  labels:
    app: aiops-dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aiops-dashboard
  template:
    metadata:
      labels:
        app: aiops-dashboard
    spec:
      containers:
      - name: dashboard
        image: aiops-dashboard:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "200m"
---
apiVersion: v1
kind: Service
metadata:
  name: aiops-dashboard
  namespace: aiops
spec:
  selector:
    app: aiops-dashboard
  type: NodePort
  ports:
  - port: 80
    targetPort: 80
    nodePort: 30080
