apiVersion: apps/v1
kind: Deployment
metadata:
  name: memory-db
  namespace: memory
  labels:
    app: memory-db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: memory-db
  template:
    metadata:
      labels:
        app: memory-db
    spec:
      containers:
      - name: postgres
        image: pgvector/pgvector:pg16
        env:
        - name: POSTGRES_USER
          value: aiops
        - name: POSTGRES_PASSWORD
          value: aiopspassword
        - name: POSTGRES_DB
          value: incident_memory
        ports:
        - containerPort: 5432
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: memory-db
  namespace: memory
spec:
  selector:
    app: memory-db
  ports:
  - port: 5432
    targetPort: 5432
