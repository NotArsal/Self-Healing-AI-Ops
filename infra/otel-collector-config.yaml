receivers:
  otlp:
    protocols:
      grpc:
      http:

exporters:
  prometheusremotewrite:
    endpoint: "http://prometheus:9090/api/v1/write"
  otlp/kavach:
    endpoint: "http://host.docker.internal:8000/api/v1/ingestion"
    tls:
      insecure: true
  loki:
    endpoint: "http://kavach-loki:3100/loki/api/v1/push"
  otlp/tempo:
    endpoint: "http://kavach-tempo:4317"
    tls:
      insecure: true

service:
  pipelines:
    traces:
      receivers: [otlp]
      exporters: [otlp/tempo, otlp/kavach]
    metrics:
      receivers: [otlp]
      exporters: [prometheusremotewrite]
    logs:
      receivers: [otlp]
      exporters: [loki]
