# OpenTelemetry Collector — the fan-out point (ARCHITECTURE.md §4.1).
#
# Receives OTLP and fans it out: metrics to Prometheus, traces to Jaeger.
#
# UNTIL 2026-10-19 THE TRACES PIPELINE EXPORTED TO `debug` AND NOTHING ELSE,
# which printed each span to this container's stdout and dropped it. Combined
# with a control plane that had no instrumentation at all, the practical
# result was a healthy-looking collector receiving nothing and forwarding it
# nowhere. `ADR 0016` adds the instrumentation; this adds somewhere for it to
# go. `debug` stays on at `basic` because a silent collector and a collector
# with no traffic look identical from outside.

receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
      grpc:
        endpoint: 0.0.0.0:4317

processors:
  batch:
    timeout: 5s
    send_batch_size: 512
  memory_limiter:
    check_interval: 5s
    limit_percentage: 75
    spike_limit_percentage: 20

exporters:
  prometheus:
    endpoint: 0.0.0.0:8889
    # Keep the resource attributes that identify which service a metric came
    # from; detection needs to tell the target's backend from Kavach itself.
    resource_to_telemetry_conversion:
      enabled: true

  debug:
    verbosity: basic

  otlp/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true   # one machine-local docker network, no CA to verify against

  # --- Still unbuilt: Kavach ingesting its own OTLP (ROADMAP P3).
  # otlphttp/kavach:
  #   endpoint: http://api:8000/v1
  #   tls:
  #     insecure: true

service:
  telemetry:
    logs:
      level: info
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [debug, otlp/jaeger]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [prometheus]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [debug]
