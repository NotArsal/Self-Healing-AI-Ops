# Load every dashboard JSON from the mounted directory on startup.
apiVersion: 1

providers:
  - name: kavach
    orgId: 1
    folder: Kavach
    type: file
    # The files are the source of truth; edits made in the browser are
    # discarded on restart. That is deliberate - a figure in the report must
    # be reproducible from the repository, not from someone's session.
    disableDeletion: true
    allowUiUpdates: false
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
