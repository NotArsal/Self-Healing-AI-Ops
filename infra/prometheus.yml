# THE one Prometheus (ARCHITECTURE.md §2.4).
#
# Phase 0 scrapes only what exists. The target's job is commented out
# deliberately: the target is not instrumented until P1, and a permanently-DOWN
# scrape target during Phase 0 acceptance is misleading noise, not information.

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: kavach

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: otel-collector
    # The collector's Prometheus exporter. Empty until something exports to it,
    # which is correct in Phase 0 — an empty 200 is still UP.
    static_configs:
      - targets: ["otel-collector:8889"]

  # Kavach watching itself (ADR 0016). This job was commented out from Phase 0
  # until 2026-10-19 because `/metrics` was a 404 - so the platform whose
  # thesis is that observability drives healing had no observability of its
  # own, and nothing in the repo said so.
  - job_name: kavach-api
    static_configs:
      - targets: ["api:8000"]
        labels:
          project: kavach
          service: control-plane

  # The target application. Scraped over its HOST-PUBLISHED port, deliberately
  # not by compose service name: this Prometheus must not require the target's
  # network to exist, and must keep working while Kavach restarts the target's
  # containers (ARCHITECTURE.md §2.4).
  #
  # This target reads DOWN until P1 instruments the backend. That is accurate,
  # not a misconfiguration — the backend already exposes /metrics, but it is not
  # running yet.
  - job_name: simple-rag-backend
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8000"]
        labels:
          project: simple-rag
          service: backend

  # THE SECOND TARGET, added 2026-11-03. LightRAG, instrumented to the same
  # `ragapp_*` contract, running in its own compose project `lightrag_target`
  # on port 9621. See `docs/SECOND_TARGET.md`.
  #
  # ADDITIVE AND SAFE TO REMOVE. Deleting this job cannot affect the first
  # target: Prometheus keeps the two apart by the `project` label, every
  # existing recording and every detector query is scoped by it, and the two
  # applications share nothing but the host's Ollama.
  #
  # Scraped over the host-published port for the same reason the first target
  # is: this Prometheus must not require another compose network to exist, and
  # must keep working while that target's containers restart.
  #
  # It reads DOWN whenever the second target is not running, which is most of
  # the time. That is accurate rather than a misconfiguration - the same
  # convention the `simple-rag-backend` job above was added under - but it does
  # mean a DOWN here is not evidence of anything being wrong.
  - job_name: lightrag-target
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:9621"]
        labels:
          project: lightrag
          service: lightrag
