# THE one Prometheus (ARCHITECTURE.md §2.4).
#
# Phase 0 scrapes only what exists. The target's job is commented out
# deliberately: the target is not instrumented until P1, and a permanently-DOWN
# scrape target during Phase 0 acceptance is misleading noise, not information.

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: kavach

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: otel-collector
    # The collector's Prometheus exporter. Empty until something exports to it,
    # which is correct in Phase 0 — an empty 200 is still UP.
    static_configs:
      - targets: ["otel-collector:8889"]

  # --- Enabled in P1, once Kavach exposes its own /metrics (ARCHITECTURE.md §12)
  # - job_name: kavach-api
  #   static_configs:
  #     - targets: ["api:8000"]

  # The target application. Scraped over its HOST-PUBLISHED port, deliberately
  # not by compose service name: this Prometheus must not require the target's
  # network to exist, and must keep working while Kavach restarts the target's
  # containers (ARCHITECTURE.md §2.4).
  #
  # This target reads DOWN until P1 instruments the backend. That is accurate,
  # not a misconfiguration — the backend already exposes /metrics, but it is not
  # running yet.
  - job_name: simple-rag-backend
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8000"]
        labels:
          project: simple-rag
          service: backend
