# Kavach control plane.
#
# Deliberately absent, and not an oversight:
#   - No Ollama.     One Ollama only (ARCHITECTURE.md §2.4). Kavach uses the
#                    host/target instance via host.docker.internal:11434.
#   - No TimescaleDB. Removed from v1 entirely (ARCHITECTURE.md §2.2).
#   - No second Prometheus. This IS the one Prometheus.
#   - No Redis YET.  Nothing in Phase 0 uses it, so it is not started. It
#                    RETURNS IN P3, where it is required by FR-16 (blast-radius
#                    windows), FR-17 (circuit-breaker counters), FR-18
#                    (idempotency keys) and ARCHITECTURE.md §4.3 (console
#                    pub/sub). This is a Phase 0 scope decision, not a removal
#                    from the architecture — see ARCHITECTURE.md §5.
#
# The target application (Simple_RAG-Pipeline) is a SEPARATE compose project in
# its own repository and is started with `make target-up`. Nothing here depends
# on it being up, so Phase 0 stands alone.

name: kavach

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: kavach-postgres
    # unless-stopped, not always: a deliberate stop must be respected, since
    # the executor will issue docker stop as part of a repair. Without any
    # policy a Docker Desktop VM suspend left the whole control plane down.
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kavach}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kavach}
      POSTGRES_DB: ${POSTGRES_DB:-kavach}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - kavach-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kavach} -d ${POSTGRES_DB:-kavach}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [kavach]

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.119.0
    container_name: kavach-otel-collector
    # unless-stopped, not always: a deliberate stop must be respected, since
    # the executor will issue docker stop as part of a repair. Without any
    # policy a Docker Desktop VM suspend left the whole control plane down.
    restart: unless-stopped
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "${OTLP_HTTP_PORT:-4318}:4318"   # OTLP/HTTP — the target exports here
      - "${OTLP_GRPC_PORT:-4317}:4317"   # OTLP/gRPC
      - "8889:8889"                      # Prometheus exporter (scraped below)
    healthcheck:
      test: ["CMD", "/otelcol-contrib", "components"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [kavach]

  prometheus:
    # THE one Prometheus. Control-plane-owned so it keeps observing the target
    # while Kavach restarts the target's containers (ARCHITECTURE.md §2.4).
    image: prom/prometheus:v3.1.0
    container_name: kavach-prometheus
    # unless-stopped, not always: a deliberate stop must be respected, since
    # the executor will issue docker stop as part of a repair. Without any
    # policy a Docker Desktop VM suspend left the whole control plane down.
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=7d"
      - "--web.enable-lifecycle"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - kavach-promdata:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9091}:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [kavach]

  api:
    build:
      context: ../apps/control-plane
      dockerfile: Dockerfile
    container_name: kavach-api
    # unless-stopped, not always: a deliberate stop must be respected, since
    # the executor will issue docker stop as part of a repair. Without any
    # policy a Docker Desktop VM suspend left the whole control plane down.
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      KAVACH_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-kavach}:${POSTGRES_PASSWORD:-kavach}@postgres:5432/${POSTGRES_DB:-kavach}
      KAVACH_PROMETHEUS_URL: http://prometheus:9090
      KAVACH_OTLP_ENDPOINT: http://otel-collector:4318
      KAVACH_LLM_BASE_URL: ${KAVACH_LLM_BASE_URL:-http://host.docker.internal:11434}
      KAVACH_LLM_MODEL: ${KAVACH_LLM_MODEL:-llama3.2}
      KAVACH_LOG_LEVEL: ${KAVACH_LOG_LEVEL:-INFO}
      # Kavach's own files. The package lives at /app/kavach with no repository
      # around it, so the root cannot be derived from __file__ the way it can
      # on a host checkout - deriving it is what used to make this container's
      # first P4 request fail with IndexError.
      KAVACH_KAVACH_ROOT: /app
      # The target runs in its OWN compose project on the host network, so
      # `localhost` here would be this container. These are the host-visible
      # ports, reached through the gateway.
      KAVACH_TARGET_HEALTH_URL: ${KAVACH_TARGET_HEALTH_URL:-http://host.docker.internal:8000/healthz}
      KAVACH_TARGET_CHAT_URL: ${KAVACH_TARGET_CHAT_URL:-http://host.docker.internal:8000/v1/chat}
      KAVACH_TARGET_CONFIG_URL: ${KAVACH_TARGET_CONFIG_URL:-http://host.docker.internal:8000/v1/admin/config}
      # No default and no literal: the token comes from .env, which is
      # gitignored. Empty means the target answers 401 and the loop escalates
      # rather than writing, which is the correct failure.
      KAVACH_TARGET_ADMIN_TOKEN: ${KAVACH_TARGET_ADMIN_TOKEN:-}
      KAVACH_CONSOLE_ORIGIN: ${KAVACH_CONSOLE_ORIGIN:-http://localhost:3001}
    ports:
      - "${API_PORT:-8080}:8000"
    volumes:
      # THE most dangerous privilege in this system (AGENTS.md security rule 14).
      # Only executor/adapters/docker.py may ever import the docker SDK, and
      # every mutation is gated on project ownership (ARCHITECTURE.md §6.3).
      # Nothing in Phase 0 mutates anything; tests/test_docker_socket.py proves
      # access against a throwaway container it creates and removes itself.
      - /var/run/docker.sock:/var/run/docker.sock
      # Read-only. The runner needs a captured known-good value to roll back
      # TO, and `make onboard` writes those on the host. Read-only because
      # capture is an onboarding operation, never something the API does.
      - ../harness/baselines:/app/harness/baselines:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/healthz', timeout=3).status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks: [kavach]

volumes:
  kavach-pgdata:
  kavach-promdata:

networks:
  kavach:
    name: kavach
