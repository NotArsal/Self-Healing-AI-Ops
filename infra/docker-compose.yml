# Kavach control plane.
#
# Deliberately absent, and not an oversight:
#   - No Ollama.     One Ollama only (ARCHITECTURE.md §2.4). Kavach uses the
#                    host/target instance via host.docker.internal:11434.
#   - No TimescaleDB. Removed from v1 entirely (ARCHITECTURE.md §2.2).
#   - No second Prometheus. This IS the one Prometheus.
#   - No Redis YET.  Nothing in Phase 0 uses it, so it is not started. It
#                    RETURNS IN P3, where it is required by FR-16 (blast-radius
#                    windows), FR-17 (circuit-breaker counters), FR-18
#                    (idempotency keys) and ARCHITECTURE.md §4.3 (console
#                    pub/sub). This is a Phase 0 scope decision, not a removal
#                    from the architecture — see ARCHITECTURE.md §5.
#
# The target application (Simple_RAG-Pipeline) is a SEPARATE compose project in
# its own repository and is started with `make target-up`. Nothing here depends
# on it being up, so Phase 0 stands alone.

name: kavach

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: kavach-postgres
    # unless-stopped, not always: a deliberate stop must be respected, since
    # the executor will issue docker stop as part of a repair. Without any
    # policy a Docker Desktop VM suspend left the whole control plane down.
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kavach}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kavach}
      POSTGRES_DB: ${POSTGRES_DB:-kavach}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - kavach-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kavach} -d ${POSTGRES_DB:-kavach}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [kavach]

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.119.0
    container_name: kavach-otel-collector
    # unless-stopped, not always: a deliberate stop must be respected, since
    # the executor will issue docker stop as part of a repair. Without any
    # policy a Docker Desktop VM suspend left the whole control plane down.
    restart: unless-stopped
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "${OTLP_HTTP_PORT:-4318}:4318"   # OTLP/HTTP — the target exports here
      - "${OTLP_GRPC_PORT:-4317}:4317"   # OTLP/gRPC
      - "8889:8889"                      # Prometheus exporter (scraped below)
    healthcheck:
      test: ["CMD", "/otelcol-contrib", "components"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [kavach]

  # Where the traces Kavach now exports actually land (ADR 0016). The
  # collector was always the fan-out point, but its traces pipeline
  # exported to `debug` only - printed to the collector's stdout and
  # discarded - so "we have tracing" meant a running process receiving
  # nothing from nobody.
  #
  # OBSERVER, NEVER PARTICIPANT. Nothing in the healing path reads this.
  # all-in-one keeps spans in memory: restarting it loses the history, which
  # is the right trade for a component that must never be load-bearing. The
  # audit log, not this, is the durable record of what Kavach did.
  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    container_name: kavach-jaeger
    restart: unless-stopped
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "${JAEGER_UI_PORT:-16686}:16686"   # the UI
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:16686/"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [kavach]

  prometheus:
    # THE one Prometheus. Control-plane-owned so it keeps observing the target
    # while Kavach restarts the target's containers (ARCHITECTURE.md §2.4).
    image: prom/prometheus:v3.1.0
    container_name: kavach-prometheus
    # unless-stopped, not always: a deliberate stop must be respected, since
    # the executor will issue docker stop as part of a repair. Without any
    # policy a Docker Desktop VM suspend left the whole control plane down.
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=7d"
      - "--web.enable-lifecycle"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - kavach-promdata:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9091}:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [kavach]

  api:
    build:
      context: ../apps/control-plane
      dockerfile: Dockerfile
    container_name: kavach-api
    # unless-stopped, not always: a deliberate stop must be respected, since
    # the executor will issue docker stop as part of a repair. Without any
    # policy a Docker Desktop VM suspend left the whole control plane down.
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      KAVACH_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-kavach}:${POSTGRES_PASSWORD:-kavach}@postgres:5432/${POSTGRES_DB:-kavach}
      KAVACH_PROMETHEUS_URL: http://prometheus:9090
      KAVACH_OTLP_ENDPOINT: http://otel-collector:4318
      KAVACH_LLM_BASE_URL: ${KAVACH_LLM_BASE_URL:-http://host.docker.internal:11434}
      KAVACH_LLM_MODEL: ${KAVACH_LLM_MODEL:-llama3.2}
      KAVACH_LOG_LEVEL: ${KAVACH_LOG_LEVEL:-INFO}
      # Kavach's own files. The package lives at /app/kavach with no repository
      # around it, so the root cannot be derived from __file__ the way it can
      # on a host checkout - deriving it is what used to make this container's
      # first P4 request fail with IndexError.
      KAVACH_KAVACH_ROOT: /app
      # The target's manifest IS the safety policy permit() reads, and it lives
      # in the TARGET's repository, which is deliberately not part of this one.
      # The host path in .env cannot be opened from inside the image, so the
      # file is mounted below and this points at the mount - the same split
      # KAVACH_KAVACH_ROOT makes, and the same bug class as the P4 IndexError:
      # a path that only ever resolved on a host checkout.
      KAVACH_TARGET_PATH: /app/target
      # The target runs in its OWN compose project on the host network, so
      # `localhost` here would be this container. These are the host-visible
      # ports, reached through the gateway.
      KAVACH_TARGET_HEALTH_URL: ${KAVACH_TARGET_HEALTH_URL:-http://host.docker.internal:8000/healthz}
      KAVACH_TARGET_CHAT_URL: ${KAVACH_TARGET_CHAT_URL:-http://host.docker.internal:8000/v1/chat}
      KAVACH_TARGET_CONFIG_URL: ${KAVACH_TARGET_CONFIG_URL:-http://host.docker.internal:8000/v1/admin/config}
      # No default and no literal: the token comes from .env, which is
      # gitignored. Empty means the target answers 401 and the loop escalates
      # rather than writing, which is the correct failure.
      KAVACH_TARGET_ADMIN_TOKEN: ${KAVACH_TARGET_ADMIN_TOKEN:-}
      KAVACH_CONSOLE_ORIGIN: ${KAVACH_CONSOLE_ORIGIN:-http://localhost:3001}
      # Cloud provider keys, all optional and all defaulting to empty.
      #
      # They were absent until 2026-10-19, which meant `llm/providers.py`
      # worked from host-side harness scripts - where pydantic reads .env
      # directly - and could not work from the control plane at all. The
      # container saw no key, every cloud provider reported itself
      # unavailable, and nothing said why.
      #
      # `:-` keeps PL-02 intact: empty is the default and a correct state,
      # so no cloud key is REQUIRED for any v1 path. Several keys for one
      # provider go in comma-separated and are rotated on 401/403/429.
      KAVACH_OPENROUTER_API_KEY: ${KAVACH_OPENROUTER_API_KEY:-}
      KAVACH_GROQ_API_KEY: ${KAVACH_GROQ_API_KEY:-}
      KAVACH_GEMINI_API_KEY: ${KAVACH_GEMINI_API_KEY:-}
      KAVACH_OPENCODEZEN_API_KEY: ${KAVACH_OPENCODEZEN_API_KEY:-}
      KAVACH_OLLAMACLOUD_API_KEY: ${KAVACH_OLLAMACLOUD_API_KEY:-}
      KAVACH_NVIDIA_API_KEY: ${KAVACH_NVIDIA_API_KEY:-}
      KAVACH_TOKENROUTER_API_KEY: ${KAVACH_TOKENROUTER_API_KEY:-}
    ports:
      - "${API_PORT:-8080}:8000"
    volumes:
      # THE most dangerous privilege in this system (AGENTS.md security rule 14).
      # Only executor/adapters/docker.py may ever import the docker SDK, and
      # every mutation is gated on project ownership (ARCHITECTURE.md §6.3).
      # Nothing in Phase 0 mutates anything; tests/test_docker_socket.py proves
      # access against a throwaway container it creates and removes itself.
      - /var/run/docker.sock:/var/run/docker.sock
      # Read-only. The runner needs a captured known-good value to roll back
      # TO, and `make onboard` writes those on the host. Read-only because
      # capture is an onboarding operation, never something the API does.
      - ../harness/baselines:/app/harness/baselines:ro
      # READ-WRITE, and it has to be. The hash-chained audit log lived in the
      # container's writable layer until 2026-10-19, which meant `docker
      # compose down`, `up --build`, or any image rebuild silently destroyed
      # every incident this project has evidence for - including the twenty
      # from the overnight bench. Found while preparing to rebuild the image
      # for the num_ctx fix; 213 rows were one command away from gone.
      #
      # The log is the evidence base for the central claim. Evidence that
      # only exists inside a container is not evidence, it is a cache.
      - ../harness/audit:/app/harness/audit
      # Read-only, and one file rather than the repository: Kavach reads the
      # target's safety policy and must never be able to widen it. TARGET_REPO
      # is relative to THIS directory (infra/), not the repository root.
      - ${TARGET_REPO:-../../Target_RAG-App}/kavach.yaml:/app/target/kavach.yaml:ro
      # READ-WRITE, and the only writable path Kavach has into the target.
      # `rollback_prompt` restores prompt files to their captured text, and
      # the target reads this same directory through its OWN read-only mount
      # with no caching, so a write here takes effect on the next request with
      # no restart.
      #
      # Scoped to `prompts/` rather than the repository on purpose. Mounting
      # the repository would also mount `.git`, and every guarantee in
      # AGENTS.md rule 10 - never push, never amend, never touch main - would
      # stop being structural (the container does not have the files) and
      # become merely procedural (the code chooses not to). Two text files is
      # the whole blast radius; `executor/prompt_rollback.py` refuses any name
      # that is not a bare `*.txt` resolving inside this directory.
      - ${TARGET_REPO:-../../Target_RAG-App}/prompts:/app/target/prompts
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/healthz', timeout=3).status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks: [kavach]

  # Read-only view over the Prometheus above (ADR 0016). Provisioned from
  # files so the dashboard is in git and survives the container: a dashboard
  # built by clicking exists only on the machine it was clicked on, which is
  # not evidence anybody can reproduce.
  #
  # OBSERVER, NEVER PARTICIPANT. It holds no credentials for the target and
  # cannot reach it; it reads one Prometheus and nothing else.
  grafana:
    image: grafana/grafana:11.3.0
    container_name: kavach-grafana
    restart: unless-stopped
    depends_on:
      prometheus:
        condition: service_healthy
    environment:
      # Anonymous VIEWER on a dashboard of counters and durations, on a
      # machine-local port. A login prompt in the middle of a live demo is a
      # worse failure than an unauthenticated graph of how long detection
      # took, and there is nothing here an operator could change.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "${GRAFANA_PORT:-3002}:3000"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [kavach]

volumes:
  kavach-pgdata:
  kavach-promdata:

networks:
  kavach:
    name: kavach
