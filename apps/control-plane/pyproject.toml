[project]
name = "kavach"
version = "0.1.0"
description = "Kavach — autonomous self-healing operations platform for AI applications"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.118",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.11",
    "pydantic-settings>=2.8",
    "structlog>=25.1",
    "pyyaml>=6.0",
    "docker>=7.1",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "prometheus-client>=0.21",
    "opentelemetry-sdk>=1.29",
    "opentelemetry-exporter-otlp-proto-http>=1.29",
    "opentelemetry-instrumentation-fastapi>=0.50b0",
]

# sqlalchemy and psycopg arrive in P5 with incident persistence: approval has
# to survive a control-plane restart, and MTTR over a series needs a series.
# psycopg3 sync rather than asyncpg because the loop is synchronous and runs in
# a worker thread; an async driver would need the whole executor path rewritten
# for no behaviour gain.
#
# Still deliberately absent: alembic, redis, langgraph.
#
# OPENTELEMETRY AND PROMETHEUS-CLIENT, added 2026-10-19 (ADR 0016). They
# were absent because Kavach watched the target and nothing watched
# Kavach: `/metrics` was a 404, the scrape job for it was commented out,
# and the collector in compose received nothing because no process ever
# exported to it. A control plane with no telemetry of its own cannot be
# the evidence for a claim about observability-driven healing.
#
# They sit OUTSIDE the healing path by construction: every call site is
# in `telemetry.py`, which swallows, and the loop and the gate are
# untouched. A collector that is down costs a graph, never a repair.
#
# LANGGRAPH, SPECIFICALLY: ARCHITECTURE 3 reserves `graph/` for it, and P5
# listed it. It is not here because the thing it would buy - resumable state
# across an approval interrupt - is delivered by persisting the incident and
# rebuilding the action on resume. Adding a graph framework to replace a
# validated `run_once()` would be a rewrite with no behaviour change. It earns
# its place when a repair needs genuinely multi-step checkpointing.
#
# docker moved from a dev extra to a runtime dependency in P1: the preflight
# ownership check needs the SDK, and preflight is shipped code, not a test.

[project.optional-dependencies]
dev = [
    "ruff>=0.9",
    "mypy>=1.15",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "httpx>=0.28",
    "types-PyYAML>=6.0",
    # Report figures only (`make figures`). A dev extra, not a runtime
    # dependency: the API image runs `uv pip install .` with no extras, so this
    # does not ship. matplotlib carries py.typed, so it needs no mypy override.
    "matplotlib>=3.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kavach"]


[tool.ruff]
target-version = "py312"
line-length = 100
# The source root, so `kavach` is classified first-party and import sorting
# keeps it in its own block below third-party.
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "ARG", "PTH", "RUF"]
# ARG is kept on deliberately: an unused argument in a graph node or adapter is
# usually a sign the signature drifted from the protocol.

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
warn_unused_ignores = true
disallow_any_explicit = false
files = ["kavach", "tests"]
mypy_path = "../.."

[[tool.mypy.overrides]]
# The docker SDK ships no type stubs. Scoped to this one import so it can never
# silently widen (AGENTS.md security rule 15).
module = ["docker.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# opentelemetry-instrumentation-* are pre-1.0 (0.5xb0) and ship no
# py.typed. Scoped to the one instrumentation package actually imported,
# not to `opentelemetry.*` - the SDK and the exporter ARE typed and must
# stay checked (AGENTS.md security rule 15).
module = ["opentelemetry.instrumentation.fastapi"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "docker: requires a reachable Docker socket; skipped when absent",
]
