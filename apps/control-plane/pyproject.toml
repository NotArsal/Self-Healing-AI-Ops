[project]
name = "kavach"
version = "0.1.0"
description = "Autonomous Self-Healing AI Operations Platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14.0",
    "asyncpg>=0.30.0",
    "fastapi>=0.115.0",
    "greenlet>=3.5.6",
    "langchain-ollama>=1.1.0",
    "langgraph>=1.2.12",
    "laya>=0.3.27",
    "opentelemetry-api>=1.45.0",
    "opentelemetry-exporter-otlp>=1.45.0",
    "opentelemetry-sdk>=1.45.0",
    "pgvector>=0.5.0",
    "pydantic>=2.9.2",
    "pydantic-settings>=2.15.0",
    "pyyaml>=6.0.3",
    "sqlalchemy>=2.0.36",
    "sse-starlette>=3.5.0",
    "uvicorn>=0.31.0",
]

[tool.uv.workspace]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.4.0",
    "pandas>=3.0.6",
    "pyarrow>=25.0.1",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.hatch.build.targets.wheel]
packages = ["kavach"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.mypy]
strict = true
