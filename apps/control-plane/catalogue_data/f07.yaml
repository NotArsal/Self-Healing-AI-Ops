actions:
- name: rollback_prompt
  inverse:
    name: rollforward_prompt
    params_mapping:
      version: $target_version
  mutations:
    prompt_version: $target_version
    prompt_health: healthy
- name: rollforward_prompt
  inverse:
    name: noop
    params_mapping: {}
  mutations:
    prompt_version: $version
faults:
- fault_class: F07
  recommended_actions:
  - rollback_prompt
