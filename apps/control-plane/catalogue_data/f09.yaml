actions:
- name: enable_token_limiter
  inverse:
    name: disable_token_limiter
    params_mapping: {}
  mutations:
    token_limiter: enabled
    token_health: healthy
- name: disable_token_limiter
  inverse:
    name: noop
    params_mapping: {}
  mutations:
    token_limiter: disabled
faults:
- fault_class: F09
  name: token and cost blowout
  recommended_actions:
  - enable_token_limiter
