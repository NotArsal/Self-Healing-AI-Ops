actions:
- name: rollback_deployment
  inverse:
    name: rollforward_deployment
    params_mapping:
      version: $target_version
  mutations:
    deployment_version: $target_version
    api_health: healthy
- name: rollforward_deployment
  inverse:
    name: noop
    params_mapping: {}
  mutations:
    deployment_version: $version
faults:
- fault_class: F03
  repair:
    action: rollback_deployment
    params:
      target_version: last_known_good
